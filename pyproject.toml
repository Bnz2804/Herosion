[project]
name = "africa-extension-agent"
version = "0.1.0"
description = "Open-source agricultural extension agent for Benin (MCP + Pydantic AI + SQLite)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic-ai-slim[mistral,openai,mcp]>=2.5",
  "mcp>=2.3",
  "typer>=0.12",
  "rich>=13",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
extension-agent = "africa_extension_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/africa_extension_agent"]
include = ["src/africa_extension_agent/db/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
