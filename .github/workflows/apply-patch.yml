name: apply-patch
on:
  push:
    branches: [main]
    paths: ["*.zip"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip uploaded patches over the repo
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Found $z, $(stat -c%s "$z") bytes"
            if ! unzip -tq "$z" >/dev/null 2>&1; then
              echo "ERROR: $z is not a valid zip. A real zip starts with the bytes P K 003 004. This file starts with:"
              head -c 16 "$z" | od -c | head -2
              exit 1
            fi
            rm -rf /tmp/p && mkdir /tmp/p
            unzip -oq "$z" -d /tmp/p
            cp -r /tmp/p/*/. .
            rm -f "$z"
          done
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "Apply uploaded patch" || exit 0
          git push origin HEAD:main
