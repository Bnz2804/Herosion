name: apply-patch
on:
  push:
    branches: [main]
    paths: ["*.zip"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip uploaded patches over the repo
        run: |
          shopt -s nullglob
          for z in *.zip; do
            rm -rf /tmp/p && mkdir /tmp/p
            unzip -oq "$z" -d /tmp/p
            cp -r /tmp/p/*/. .
            rm -f "$z"
          done
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "Apply uploaded patch" || exit 0
          git push origin HEAD:main
