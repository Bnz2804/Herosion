name: apply-patch
on:
  push:
    branches: [main]
    paths: ["*.zip"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip uploaded patches over the repo
        run: |
          shopt -s nullglob
          fail() { echo "::error::$1"; exit 1; }
          for z in *.zip; do
            echo "Found $z, $(stat -c%s "$z") bytes"
            unzip -tq "$z" >/dev/null 2>&1 || fail "$z is not a valid zip ($(stat -c%s "$z") bytes). It starts with: $(head -c 16 "$z" | od -An -c | tr -s ' ')"
            if unzip -Z1 "$z" | grep -q '^[^/]*/\.github/workflows/'; then
              fail "$z contains .github/workflows files; GitHub does not let this action change workflows. Upload a patch zip without them."
            fi
            rm -rf /tmp/p && mkdir /tmp/p
            unzip -oq "$z" -d /tmp/p
            cp -r /tmp/p/*/. . || fail "copying files from $z failed (is everything inside one top folder?)"
            rm -f "$z"
          done
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "Apply uploaded patch" || { echo "Nothing to commit"; exit 0; }
          git pull --rebase -q origin main || fail "could not rebase onto main"
          git push origin HEAD:main 2>/tmp/push.log || fail "git push failed: $(tr '\n' ' ' < /tmp/push.log | cut -c1-300)"
